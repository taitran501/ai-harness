[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-harness-stereoqueereval"
version = "0.1.0"
description = "StereoQueerEval task adapter for ML-Harness"
requires-python = ">=3.10"
dependencies = ["ml-harness[ml]>=0.2.0"]

[project.entry-points."ml_harness.task_plugins"]
stereoqueereval = "stereoqueereval_plugin:StereoQueerEvalPlugin"

[tool.setuptools]
py-modules = ["stereoqueereval_plugin"]
