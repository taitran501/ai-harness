# Experiment 001: TF-IDF + Logistic Regression Baseline
experiment:
  id: "exp001_baseline_tfidf"
  branch: "baseline"
  parent_id: "none"
  description: "Five-fold grouped cross-validation using word and char n-gram TF-IDF with balanced Logistic Regression."
  date: "2026-09-23"
  problem_addressed: "Establish a competitive, fast, and reproducible sparse control baseline across all three subtasks."
  hypothesis: "Word (1-2) and char (3-5) n-gram TF-IDF provides a solid lower bound for Subtasks A and B, but will exhibit low Macro-F1 on rare Subtask C identity labels due to lack of semantic generalization."
  intervention: "Canonical baseline reference implementation across comment, title_comment, and full_context variants."

task:
  name: "StereoQueerEval"
  type: "classification"
  primary_metric: "macro_f1"
  direction: "maximize"
  approach_type: "ml"
  model_family: "linear"

grounding:
  source_type: "verified_baseline"
  source_id: "sklearn_tfidf_logreg_canonical"
  retrieval_summary: "Canonical n-gram TF-IDF reference control for StereoQueerEval grouped CV benchmarking."
  verified_via: "local_registry"

assumption_register:
  known_facts:
    - "StereoQueerEval dataset has 3 languages: EN, IT, NL with extreme identity imbalance."
    - "Video-grouped cross-validation on fold_assignments.tsv prevents comment leakage."
  assumptions:
    - "Word (1-2) and char (3-5) n-grams provide a stable competitive baseline floor."
  uncertainty_level: "low"

model:
  name: "tfidf_logistic_regression"
  params:
    c_param: 2.0
    seed: 42

data:
  input_variants:
    - "comment"
    - "title_comment"
    - "full_context"
  folds: [0, 1, 2, 3, 4]
