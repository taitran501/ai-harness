# Universal Experiment Configuration Template
# Format: configs/exp<NNN>_<branch>_<descriptor>.yaml
experiment:
  id: "exp000_template"
  branch: "feat"                  # Options: baseline, feat, model, loss, ens
  parent_id: "exp000_baseline"    # Points to parent experiment node in journal.json
  date: "2026-09-27"
  problem_addressed: "Baseline performance is limited by unoptimized input representation."
  hypothesis: "Applying structured feature engineering and regularization will improve primary validation metric by >=2.0%."
  intervention: "Add n-gram / polynomial feature transforms and tune L2 regularization."

# Universal Task Specification (Declarative Contract)
task:
  name: "Competition_Benchmark"
  type: "classification"           # classification | regression | multi_label | ranking
  primary_metric: "macro_f1"       # Primary optimization objective
  direction: "maximize"            # maximize | minimize
  approach_type: "ml"              # ml (classical tabular/n-gram) | dl (deep learning/transformers) | llm
  model_family: "linear"           # linear | tree | transformer | llm_peft | ensemble

grounding:
  source_type: "verified_baseline" # Options: huggingface_hub, arxiv, empirical_journal, verified_baseline
  source_id: "feature_pipeline_baseline"
  retrieval_summary: "Canonical baseline pipeline for feature representation and regularization."
  verified_via: "local_registry"   # search_web, read_url_content, huggingface_hub, local_registry

# Assumption Register: Explicit separation of established facts from assumptions (Edwards & Schuster, 2026)
assumption_register:
  known_facts:
    - "Validation split follows evaluation scheme defined in task.yaml."
  assumptions:
    - "Feature scaling and regularization prevents overfitting on validation holdouts."
  uncertainty_level: "low"         # Options: low, medium, high (if high, verification_probe is required)
  verification_probe: "Execute single-fold probe or smoke test before full validation."

constraints:
  max_params_limit: 150000000

data:
  train_path: "dataset/"
  feature_columns: ["text"]
  target_column: "target"

model:
  name: "logistic_regression"
  params:
    C: 1.0
    max_iter: 1000

training:
  seed: 42
  folds: [0, 1, 2, 3, 4]
  debug: false
