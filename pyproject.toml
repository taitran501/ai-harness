[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.2.0"
description = "Installable experiment and agent harness for competition task plugins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "scikit-learn>=1.3.0",
  "lightgbm>=4.0.0",
  "xgboost>=2.0.0",
  "pyyaml>=6.0",
  "scipy>=1.11.0",
]

[project.optional-dependencies]
cloud = ["modal>=1.5.0", "kaggle>=1.6.0"]
# Parallel dev-path for the unit/regression suite (see conftest.py):
#   pip install -e ".[test]"  &&  python -m pytest tests -n auto
# The canonical gate stays unittest-based: python tools/run_tests.py
test = ["pytest>=8.0", "pytest-xdist>=3.6"]

[project.scripts]
ai-harness = "harness.cli:main"
ai-harness-agent = "tools.agent_bridge_cli:main"
ai-harness-dashboard = "tools.dashboard_cli:main"
ai-harness-run = "harness.runner:main"
ai-harness-audit = "tools.audit_gate:main"
ai-harness-bootstrap = "tools.bootstrap_task:main"
ml-harness = "harness.cli:main"
ml-harness-agent = "tools.agent_bridge_cli:main"
ml-harness-run = "harness.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*", "tools*", "ai_harness*", "ml_harness*"]

[tool.setuptools.package-data]
tools = ["web/index.html", "web/assets/*"]
harness = ["defaults/*.yaml", "defaults/tasks/*.yaml", "templates/*.py"]

# Pytest: the suite has no async tests, but pytest-asyncio is installed and
# otherwise emits a session-wide deprecation warning about the unset default
# fixture loop scope. Pinning it explicitly silences the warning and pins
# the behavior for any future async fixture.
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
