[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness"
version = "0.2.0"
description = "Installable experiment and agent harness for competition task plugins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "pyyaml>=6.0",
  "scipy>=1.11.0",
]

[project.optional-dependencies]
cloud = ["modal>=1.5.0", "kaggle>=1.6.0"]

[project.scripts]
ai-harness = "harness.cli:main"
ai-harness-agent = "tools.agent_bridge_cli:main"
ai-harness-dashboard = "tools.dashboard_cli:main"
ai-harness-run = "harness.runner:main"
ai-harness-audit = "tools.audit_gate:main"
ai-harness-bootstrap = "tools.bootstrap_task:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*", "tools*"]

[tool.setuptools.package-data]
tools = ["web/index.html", "web/assets/*"]
harness = ["defaults/*.yaml", "defaults/tasks/*.yaml", "templates/*.py", "vendor/*.py"]
